manifestVersion: 1
name: "@dougschaefer/ms-graph"
version: "2026.08.17.1"
description: "Broad Microsoft Graph extension — nine model types over one shared app-only client: calendar (room/user calendarView, current/next meeting), places (room resources), users (Entra directory reads, manager, memberOf), groups, mail (Outlook messages), teams (chats/teams/channels/messages), presence, sharepoint (document-library navigation, search, and file download, working under either Sites.Read.All or Sites.Selected), and intune (enrolled devices, compliance policies, configuration profiles and settings catalog, remediation scripts, confirmation-gated device actions, and async report exports). Token caching, automatic paging, and a raw-bytes downloader; app credentials supplied from a vault. Supersedes the narrow ms-graph-calendar and absorbs azure-ad-user's lookup."
repository: https://github.com/dougschaefer6/swamp-ms-graph
additionalFiles:
  - README.md
  - LICENSE.txt
labels:
  - microsoft-graph
  - m365
  - entra
  - identity
  - calendar
  - places
  - rooms
  - exchange
  - teams
  - presence
  - mail
  - groups
  - iars
  - rest
  - sharepoint
  - documents
  - intune
  - mdm
  - device-management
  - endpoint
models:
