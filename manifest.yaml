  - ms-graph/places.ts
  - ms-graph/users.ts
  - ms-graph/groups.ts
  - ms-graph/mail.ts
  - ms-graph/teams.ts
  - ms-graph/presence.ts
  - ms-graph/sharepoint.ts
  - ms-graph/intune.ts
